[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stig-registry-toolkit"
dynamic = ["version"]
description = "Check and enforce DISA STIG registry settings on Windows, from a CLI or a PyQt6 GUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "enonymous1" }]
keywords = ["stig", "disa", "registry", "windows", "compliance", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
stig-registry-toolkit = "stig_registry_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/stig-registry-toolkit"
Repository = "https://github.com/enonymous1/stig-registry-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "stig_registry_toolkit.__version__" }

[tool.setuptools.package-data]
stig_registry_toolkit = ["data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PLC", "BLE"]
ignore = ["PLC0415", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"src/stig_registry_toolkit/gui.py" = ["BLE001"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "stig_registry_toolkit.gui"
ignore_missing_imports = true
